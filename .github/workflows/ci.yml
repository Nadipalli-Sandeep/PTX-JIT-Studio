name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake and C++
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure CPU-only build
        run: cmake -S . -B build -DPTXJIT_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
